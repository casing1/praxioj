name: praxioj
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: praxioj
      POSTGRES_USER: praxioj
      POSTGRES_PASSWORD: praxioj
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U praxioj -d praxioj']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &runtime_environment
      DATABASE_URL: postgresql+psycopg://praxioj:praxioj@db:5432/praxioj
      PRAXIOJ_ENV: development
      PRAXIOJ_DEFAULT_PROFILE: ${PRAXIOJ_DEFAULT_PROFILE:-mock}
      PRAXIOJ_LLM_BASE_URL: ${PRAXIOJ_LLM_BASE_URL:-}
      PRAXIOJ_LLM_MODEL: ${PRAXIOJ_LLM_MODEL:-}
      PRAXIOJ_LLM_API_KEY: ${PRAXIOJ_LLM_API_KEY:-}
      PRAXIOJ_LLM_SUPPORTS_TOOLS: ${PRAXIOJ_LLM_SUPPORTS_TOOLS:-false}
      PRAXIOJ_LLM_SUPPORTS_SYSTEM: ${PRAXIOJ_LLM_SUPPORTS_SYSTEM:-true}
      PRAXIOJ_LLM_SUPPORTS_TEMPERATURE: ${PRAXIOJ_LLM_SUPPORTS_TEMPERATURE:-true}
      PRAXIOJ_LLM_TOKEN_PARAMETER: ${PRAXIOJ_LLM_TOKEN_PARAMETER:-max_tokens}
      PRAXIOJ_LLM_TIMEOUT_SECONDS: ${PRAXIOJ_LLM_TIMEOUT_SECONDS:-30}
      PRAXIOJ_PRICE_INPUT_PER_MILLION: ${PRAXIOJ_PRICE_INPUT_PER_MILLION:-}
      PRAXIOJ_PRICE_OUTPUT_PER_MILLION: ${PRAXIOJ_PRICE_OUTPUT_PER_MILLION:-}
      PRAXIOJ_PRICE_CURRENCY: ${PRAXIOJ_PRICE_CURRENCY:-USD}
      PRAXIOJ_COOKIE_SECURE: ${PRAXIOJ_COOKIE_SECURE:-false}
      PRAXIOJ_AUTH_SESSION_SECONDS: ${PRAXIOJ_AUTH_SESSION_SECONDS:-28800}
      PRAXIOJ_AUTH_MAX_SESSIONS: ${PRAXIOJ_AUTH_MAX_SESSIONS:-5}
      PRAXIOJ_AUTH_REAUTHENTICATION_SECONDS: ${PRAXIOJ_AUTH_REAUTHENTICATION_SECONDS:-300}
      PRAXIOJ_AUTH_RATE_WINDOW_SECONDS: ${PRAXIOJ_AUTH_RATE_WINDOW_SECONDS:-300}
      PRAXIOJ_AUTH_IP_LIMIT: ${PRAXIOJ_AUTH_IP_LIMIT:-30}
      PRAXIOJ_AUTH_ACCOUNT_LIMIT: ${PRAXIOJ_AUTH_ACCOUNT_LIMIT:-10}
      PRAXIOJ_API_IP_LIMIT: ${PRAXIOJ_API_IP_LIMIT:-600}
      PRAXIOJ_API_RATE_WINDOW_SECONDS: ${PRAXIOJ_API_RATE_WINDOW_SECONDS:-60}
      PRAXIOJ_ACCOUNT_ACTIVE_SESSIONS: ${PRAXIOJ_ACCOUNT_ACTIVE_SESSIONS:-10}
      PRAXIOJ_ACCOUNT_RETAINED_SESSIONS: ${PRAXIOJ_ACCOUNT_RETAINED_SESSIONS:-100}
      PRAXIOJ_SYSTEM_RETAINED_SESSIONS: ${PRAXIOJ_SYSTEM_RETAINED_SESSIONS:-10000}
      PRAXIOJ_ACCOUNT_ACTIVE_RUNS: ${PRAXIOJ_ACCOUNT_ACTIVE_RUNS:-2}
      PRAXIOJ_QUEUE_MAX_PENDING: ${PRAXIOJ_QUEUE_MAX_PENDING:-100}
      PRAXIOJ_WORKER_MAX_RUNNING: ${PRAXIOJ_WORKER_MAX_RUNNING:-4}
      PRAXIOJ_WORKER_SHUTDOWN_SECONDS: ${PRAXIOJ_WORKER_SHUTDOWN_SECONDS:-5}
      PRAXIOJ_ACCOUNT_DAILY_MODEL_CALLS: ${PRAXIOJ_ACCOUNT_DAILY_MODEL_CALLS:-200}
      PRAXIOJ_PROBLEM_DAILY_MODEL_CALLS: ${PRAXIOJ_PROBLEM_DAILY_MODEL_CALLS:-2000}
      PRAXIOJ_SYSTEM_DAILY_MODEL_CALLS: ${PRAXIOJ_SYSTEM_DAILY_MODEL_CALLS:-10000}
      PRAXIOJ_ACCOUNT_DAILY_TOOL_CALLS: ${PRAXIOJ_ACCOUNT_DAILY_TOOL_CALLS:-400}
      PRAXIOJ_PROBLEM_DAILY_TOOL_CALLS: ${PRAXIOJ_PROBLEM_DAILY_TOOL_CALLS:-4000}
      PRAXIOJ_SYSTEM_DAILY_TOOL_CALLS: ${PRAXIOJ_SYSTEM_DAILY_TOOL_CALLS:-20000}
      PRAXIOJ_ACCOUNT_DAILY_TOKEN_ALLOWANCE: ${PRAXIOJ_ACCOUNT_DAILY_TOKEN_ALLOWANCE:-2000000}
      PRAXIOJ_PROBLEM_DAILY_TOKEN_ALLOWANCE: ${PRAXIOJ_PROBLEM_DAILY_TOKEN_ALLOWANCE:-20000000}
      PRAXIOJ_SYSTEM_DAILY_TOKEN_ALLOWANCE: ${PRAXIOJ_SYSTEM_DAILY_TOKEN_ALLOWANCE:-100000000}
      PRAXIOJ_CALL_TOKEN_RESERVATION: ${PRAXIOJ_CALL_TOKEN_RESERVATION:-16384}
      PRAXIOJ_SESSION_ARTIFACT_MAX_BYTES: ${PRAXIOJ_SESSION_ARTIFACT_MAX_BYTES:-1048576}
      PRAXIOJ_SESSION_TRACE_MAX_BYTES: ${PRAXIOJ_SESSION_TRACE_MAX_BYTES:-8388608}
      PRAXIOJ_SESSION_TRACE_MAX_EVENTS: ${PRAXIOJ_SESSION_TRACE_MAX_EVENTS:-2000}
      PRAXIOJ_ACCOUNT_ARTIFACT_CAPACITY_BYTES: ${PRAXIOJ_ACCOUNT_ARTIFACT_CAPACITY_BYTES:-16777216}
      PRAXIOJ_SYSTEM_ARTIFACT_CAPACITY_BYTES: ${PRAXIOJ_SYSTEM_ARTIFACT_CAPACITY_BYTES:-268435456}
      PRAXIOJ_ACCOUNT_TRACE_CAPACITY_BYTES: ${PRAXIOJ_ACCOUNT_TRACE_CAPACITY_BYTES:-268435456}
      PRAXIOJ_SYSTEM_TRACE_CAPACITY_BYTES: ${PRAXIOJ_SYSTEM_TRACE_CAPACITY_BYTES:-2147483648}
      PRAXIOJ_EXPORT_MAX_BYTES: ${PRAXIOJ_EXPORT_MAX_BYTES:-16777216}
      PRAXIOJ_EXPORT_MAX_ROWS: ${PRAXIOJ_EXPORT_MAX_ROWS:-10000}
      PRAXIOJ_WORKER_LEASE_SECONDS: ${PRAXIOJ_WORKER_LEASE_SECONDS:-15}
      PRAXIOJ_WORKER_HEARTBEAT_SECONDS: ${PRAXIOJ_WORKER_HEARTBEAT_SECONDS:-3}
      PRAXIOJ_WORKER_POLL_SECONDS: ${PRAXIOJ_WORKER_POLL_SECONDS:-0.5}
      PRAXIOJ_TRACE_RETENTION_DAYS: ${PRAXIOJ_TRACE_RETENTION_DAYS:-30}
      PRAXIOJ_TRACE_RETENTION_MAX_DAYS: ${PRAXIOJ_TRACE_RETENTION_MAX_DAYS:-90}
      PRAXIOJ_AUDIT_RETENTION_DAYS: ${PRAXIOJ_AUDIT_RETENTION_DAYS:-90}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [backend, local]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *runtime_environment
    command: [python, -m, praxioj_api.worker]
    stop_grace_period: 15s
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    networks: [backend, local]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [local]

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  local:
    driver: bridge
