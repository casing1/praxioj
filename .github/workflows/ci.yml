# SPDX-License-Identifier: Apache-2.0
# Offline CI: never use paid LLM providers or repository secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.13 / PostgreSQL 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: praxioj_ci
          POSTGRES_USER: praxioj_ci
          POSTGRES_PASSWORD: praxioj_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxioj_ci -d praxioj_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRAXIOJ_RUN_LIVE_TESTS: "0"
      PRAXIOJ_TEST_DATABASE_URL: postgresql+psycopg://praxioj_ci:praxioj_ci@127.0.0.1:5432/praxioj_ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned Python dependencies
        run: python -m pip install -c requirements.lock -e packages/framework -e 'apps/api[test]'
      - name: Run offline Python tests, including PostgreSQL cases
        run: python -m pytest -q
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify vendored license notices
        run: python scripts/sync-licenses.py --check

  frontend:
    name: Node 24 / frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix apps/web ci
      - name: Run frontend tests
        run: npm --prefix apps/web test
      - name: Verify TypeScript and production build
        run: npm --prefix apps/web run build

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration without starting services
        run: docker compose config --quiet
      - name: Build and start the local API, worker, database, and web proxy
        run: docker compose up --build -d --wait
      - name: Verify account, worker, tools, trace integrity, and evidence evaluation
        run: python3 scripts/smoke-m3.py --base-url http://127.0.0.1:5173
      - name: Stop the ephemeral CI stack
        if: always()
        run: docker compose down
