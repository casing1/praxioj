[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "praxioj-api"
version = "0.1.0"
description = "Local development platform for the PraxiOJ framework"
authors = [{name = "DoHyun Choi"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
  "praxioj-framework==0.1.0",
  "fastapi==0.162.2",
  "SQLAlchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
